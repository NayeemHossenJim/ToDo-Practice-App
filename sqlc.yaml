version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/schemas"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_methods_with_db_argument: false